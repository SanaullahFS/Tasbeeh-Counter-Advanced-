<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbikh Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 800px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.0rem;
            color: #667eea;
            font-weight: 800;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        h1:hover {
            transform: scale(1.05);
        }

        .image-container {
            margin-bottom: 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-container:hover img {
            transform: scale(1.02);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            margin-top: 20px;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .counter-info {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f4ff 100%);
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .counter-info p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 3rem;
            }

            button {
                padding: 15px 40px;
                font-size: 1rem;
            }

            img {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            button {
                padding: 12px 30px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="counter">0</h1>
        
        <div class="image-container">
            <img src="./All in one.jpg" alt="Tasbikh Counter Image">
        </div>
        
        <button>📿 Increment Counter</button>
        
        <div class="counter-info">
            <p><strong>🕌 Tasbikh Counter</strong></p>
            <p>Press the button to increment and hear different sounds for each range!</p>
        </div>
    </div>
<script>
    let head = document.getElementById("counter")
    let btn = document.querySelector("button")
    let image = document.querySelector("img")
    let count = 0

    // Function to play sounds with different frequencies
    function playSound(frequency, duration = 0.1) {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = frequency;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
    }

    btn.addEventListener("click",()=>{
        count++
        head.textContent = count
        if(count === 0){
            image.src = "All in one.jpg"
        }
        else if(count >= 1 && count <= 33){
            image.src = "./Subhanal.png"
            playSound(600); // Low frequency for Subhanal
        }
        else if(count >= 34 && count <= 65){
            image.src = "./Ahamdu.png"
            playSound(800); // Medium frequency for Ahamdu
        }
        else if(count >= 66 && count <= 99){
            image.src = "./Allahho.png"
            playSound(1000); // High frequency for Allahho
        }
        else if(count === 100){
            image.src = "./lahawla.png"
            playSound(1200, 0.2); // Highest frequency with longer duration for lahawla
        }
        else{
            console.log("Good")
        }
    })
</script>
</html>
